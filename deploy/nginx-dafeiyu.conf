# 大肥鱼网页端 · nginx 反向代理示例（域名 + HTTPS）
#
# 这是线上实际在用的配置（脱敏成模板）。改三处就能用：
#
#   1. server_name                 —— 换成你自己的域名
#   2. ssl_certificate / _key      —— 换成你自己的证书
#   3. access_log / error_log      —— 换成你放日志的地方
#
# 用法：
#   sudo cp nginx-dafeiyu.conf /etc/nginx/sites-available/dafeiyu
#   sudo ln -s /etc/nginx/sites-available/dafeiyu /etc/nginx/sites-enabled/dafeiyu
#   sudo nginx -t && sudo systemctl reload nginx     # 一定用 reload，别用 restart
#
# 路由约定（和后端 backend/main.py 对应）：
#
#   普通版  https://<你的域名>/       ->  127.0.0.1:8765/
#   高清版  https://<你的域名>/hd/    ->  127.0.0.1:8765/hd/
#
# 两版同一个域名、同一个端口、同一个后端，只用路径区分：
#   - /hd/ 是后端里独立目录的路由（挂载 hd-pkg），内容与根路径完全隔离
#   - /api 与 /ws 两版天然共用一套，不用配两遍
#
# 下面四件事**不能省**，少一个就会出看起来像「站点坏了」的怪问题：
#   1. Range：webm 是无缝切段播放，后端返回 206；nginx 默认已透传，别加
#      proxy_ignore_headers / 自己拼 Content-Length，否则视频拖动会坏。
#   2. WebSocket Upgrade：前端靠 /ws 多端同步；nginx 默认 60s 读超时会掐掉
#      空闲连接（表现是前端一直重连），所以 /ws 单独给 3600s。
#   3. gzip_types：很多发行版的 nginx.conf 里 `gzip on` 开着但 `gzip_types`
#      被注释掉，默认只压 text/html → index-*.js（约 498 KB）原样明文下发。
#      这里显式列出来。**不压 webm/webp/mov**：已经压过了，再 gzip 白费 CPU
#      还可能打乱 Range。
#   4. proxy_max_temp_file_size 0：一旦开了 gzip，上游响应就不能边收边发
#      （否则压不了），nginx 会先读全再压。默认缓冲区只有 4/8k，一超就落临时
#      文件（日志里刷 "buffered to a temporary file"）。小磁盘机器上纯属白吃 IO。

server {
    listen      80;
    listen [::]:80;
    server_name dafeiyu.example.com;          # ← 改成你的域名

    # 一律跳 HTTPS（保留原始路径与查询串，/hd/ 也会被带过去）
    return 301 https://$host$request_uri;
}


server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dafeiyu.example.com;          # ← 改成你的域名

    # 通配符证书 `*.example.com` 也覆盖这个子域名，不必单独签
    ssl_certificate     /etc/nginx/ssl/example.com.crt;      # ← 改成你的证书
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 没开 HSTS。开了之后浏览器会记住「只走 https」，回退会很痛，
    # 确认所有入口都有证书了再加：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/dafeiyu.access.log;            # ← 改成你的路径
    error_log  /var/log/nginx/dafeiyu.error.log warn;

    client_max_body_size 8m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/manifest+json
                      image/svg+xml;

    proxy_buffers            8 32k;
    proxy_buffer_size        32k;
    proxy_busy_buffers_size  64k;
    proxy_max_temp_file_size 0;

    # ── WebSocket（多端同步，普通版与 /hd 共用同一个连接）──────
    location = /ws {
        proxy_pass http://127.0.0.1:8765/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 视频：流式转发，不落 nginx 缓冲（拖动 / 切段才跟手）──────
    # 同时覆盖 /assets/anim/a001.webm 与 /hd/assets/anim/a001.webm
    location ~* \.(webm|mov)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 其余全部：页面 / 素材 / /api / /hd 都交给后端 ──────────
    # /hd 与 /hd/ 由后端自己处理（/hd -> 308 -> /hd/），这里不要重复造路由，
    # 也别把那个 308 吃掉：少了结尾斜杠，页面会用根路径的 /assets/ 拿素材，
    # 表现是「/hd 打开却是普通版的画面」。
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
